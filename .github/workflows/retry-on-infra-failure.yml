name: senate-scrape-retry

# Když "senate-scrape" spadne na infrastruktuře (job umře dřív, než se spustí
# jediný náš krok — typicky "Failed to resolve action download info" v
# "Set up job", nebo ho GitHub uprostřed výpadku zruší), zkusí ho jednou
# spustit znovu. Spadl-li skutečný krok, je to chyba scraperu a rerun se
# schválně nedělá.
#
# NOTIFIKACE TADY NEJSOU, a je to schválně. Původně tu byly a 6. 8. 2026 se
# ukázalo, proč to nefunguje: při výpadku se toho dne nedal přidělit runner,
# takže i tenhle job skončil po 15 minutách jako "cancelled" s nula kroky.
# Hlídač visel na tom, co měl hlídat, a neodešlo nic. Zprávy proto posílá
# dispatcher na VPS (/root/political/senate_dispatch.py), který běží každých
# 10 minut mimo GitHub a stav běhů si čte přes API.
#
# Workflow nepoužívá ŽÁDNOU externí akci, ani actions/checkout: jedna z
# poruch, kvůli kterým existuje, se projevuje právě tím, že se akce nedají
# stáhnout.

on:
  workflow_run:
    workflows: ["senate-scrape"]
    types: [completed]

permissions:
  actions: write # rerun-failed-jobs

jobs:
  triage:
    # run_attempt == 1 je pojistka proti smyčce: rerun vyrobí attempt 2,
    # jehož dokončení sem přijde znovu — a tady se už zastaví.
    if: >-
      github.event.workflow_run.conclusion != 'success'
      && github.event.workflow_run.conclusion != 'skipped'
      && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Rozliš infra selhání od chyby scraperu
        id: triage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail

          jobs_json=$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs?per_page=100")

          # Kroky, které fakt spadly. Dvě jména se nepočítají:
          #  - "Set up job" generuje runner sám a jeho selhání znamená právě
          #    to, že se náš kód vůbec nespustil;
          #  - krok s WAF hlásí, že Akamai odmítl IP tohohle runneru — taky
          #    to není chyba kódu a rerun (= jiná IP) je přesně ten lék.
          #    Jméno musí sedět s .github/workflows/senate.yml.
          real=$(printf '%s' "$jobs_json" | jq -r '
            [ .jobs[].steps[]?
              | select(.conclusion == "failure")
              | select(.name != "Set up job")
              | select(.name != "Blocked by Senate EFD WAF (retry-worthy)")
              | .name ] | join(", ")')

          waf=$(printf '%s' "$jobs_json" | jq -r '
            [ .jobs[].steps[]?
              | select(.conclusion == "failure")
              | select(.name == "Blocked by Senate EFD WAF (retry-worthy)") ]
            | length')

          if [ -n "$real" ]; then
            echo "kind=code" >> "$GITHUB_OUTPUT"
            echo "Spadlé kroky: $real → skutečná chyba, rerun se NEdělá."
          elif [ "$waf" -gt 0 ]; then
            echo "kind=waf" >> "$GITHUB_OUTPUT"
            echo "Senate EFD odmítl IP runneru → rerun (dostane jinou IP)."
          else
            echo "kind=infra" >> "$GITHUB_OUTPUT"
            echo "Žádný náš krok nespadl → výpadek infrastruktury, zkusím rerun."
          fi

      # Během probíhajícího výpadku je okamžitý rerun skoro jistě k ničemu —
      # chvíli počkat výrazně zvedá šanci, že projde napoprvé. U WAF se
      # nečeká: nový runner má jinou IP hned.
      - name: Počkej, než se to usadí
        if: steps.triage.outputs.kind == 'infra'
        run: sleep 120

      - name: Spusť běh znovu
        if: steps.triage.outputs.kind == 'infra' || steps.triage.outputs.kind == 'waf'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -uo pipefail
          if gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs"; then
            echo "Spuštěn rerun (attempt 2)."
          else
            echo "⚠️ Rerun se nepodařilo spustit (Actions API nedostupné)."
            echo "Nevadí — dispatcher na VPS pošle nový běh do 10 minut."
          fi
