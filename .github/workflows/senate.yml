name: senate-scrape

on:
  # Bez `schedule`: kadenci řídí senate-dispatch.timer na VPS (workflow_dispatch
  # á 30 min, do 2026-11-11 á 10 min). Záložní cron GitHub z ~93 % zahazoval a při výpadku jen chodily
  # maily o selhání — odebrán 2026-10-25.
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Backfill window (days)"
        required: false
        default: "30"

permissions:
  contents: read

concurrency:
  group: senate-scrape
  cancel-in-progress: false

jobs:
  scrape:
    # Pevná verze, ne ubuntu-latest: od 2026-10-19 přejde latest na Ubuntu 26
    # a `playwright install-deps` (playwright 1.49) zná balíčky jen do 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Opt into Node.js 24 ahead of GitHub's June 2026 forced switch.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Systémové knihovny přes apt. 2026-11-11 runnery přes hodinu nedokázaly
      # přeložit `azure.archive.ubuntu.com` (zrcadlo Ubuntu v Azure) a krok
      # padal po ~8 min timeoutů — triáž to bere jako chybu kódu, takže se ani
      # neopakovalo. Zrcadlo nebere apt ze sources.list, ale ze seznamu
      # /etc/apt/apt-mirrors.txt (`mirror+file:`); když se azure nepřeloží,
      # nahradí se seznam hlavním archive.ubuntu.com (nese i noble-security).
      - name: Install Playwright system deps
        run: |
          use_archive() {
            echo "::warning::$1 — apt jede přes archive.ubuntu.com"
            echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          }
          getent hosts azure.archive.ubuntu.com >/dev/null || use_archive "azure.archive.ubuntu.com se nepřeložil"
          for i in 1 2 3; do
            playwright install-deps chromium && exit 0
            use_archive "install-deps pokus $i selhal"
            sleep 10
          done
          exit 1

      - name: Install Playwright chromium (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium

      - name: Run scraper
        id: scrape
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '7' }}
          HEADLESS: "true"
        run: |
          set +e
          python scraper.py
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 75 = Akamai odmítl IP tohohle runneru. Neselže se tady, ať se
          # dostaneme na krok níž, jehož jméno rozliší tuhle situaci od
          # skutečné chyby scraperu.
          if [ "$code" -ne 0 ] && [ "$code" -ne 75 ]; then
            exit "$code"
          fi

      # Blokace je vázaná na IP runneru, takže lékem je běh na jiném runneru.
      # ⚠️ Jméno kroku čte triage v retry-on-infra-failure.yml — když ho
      # změníš tady, změň ho i tam, jinak se rerun přestane dělat.
      - name: Blocked by Senate EFD WAF (retry-worthy)
        if: steps.scrape.outputs.code == '75'
        run: |
          echo "::warning::Senate EFD (Akamai) odmítl IP tohoto runneru — rerun dostane jinou."
          exit 1
